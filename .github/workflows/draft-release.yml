name: Draft Release

# 只手动触发，和 CI / Publish SDK 保持一致的发布节奏。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0，不带 v 前缀）'
        required: true
        default: '1.0.0'
        type: string
      tag:
        description: 'Git tag（留空则用 version 自动拼接）'
        required: false
        type: string

permissions:
  contents: write

env:
  APP_VERSION: ${{ github.event.inputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
        env:
          REQUIRE_WASM: '1'
      - run: pnpm build
      - name: Package static build
        run: tar -czf mx-player-pro-${APP_VERSION}.tar.gz dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-v${APP_VERSION}}"
          gh release create "$TAG" "mx-player-pro-${APP_VERSION}.tar.gz" \
            --draft --generate-notes --target "$GITHUB_SHA" \
            --title "MX Player Pro $TAG"
