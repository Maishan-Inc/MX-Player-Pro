name: Publish SDK

# jsDelivr 的 /gh/ 路径直接读 git 树，所以产物必须提交到仓库里。
# 把它放在独立的 cdn 分支，避免污染 main 的历史。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0，不带 v 前缀）'
        required: true
        default: '1.2.0'
        type: string
      tag:
        description: 'Git tag（例如 v1.0.0，留空则用 version 自动拼接）'
        required: false
        type: string

permissions:
  contents: write

env:
  APP_VERSION: ${{ github.event.inputs.version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib

      - name: Verify SDK artifacts
        run: |
          set -euo pipefail
          test -f dist-lib/mx-player.js
          test -f dist-lib/mx-player-react.js
          test -f dist-lib/mx-player-vue.js
          test -f dist-lib/mx-player-worker.js
          test -f dist-lib/mx-player.css
          test -f dist-lib/package.json
          test ! -d dist-lib/assets
          test ! -d dist-lib/wasm
          ! grep -R -E 'assets/demux\.worker|mkv_demuxer' dist-lib/*.js
          # 浏览器里没有 process。库模式默认保留 process.env.NODE_ENV，
          # 一旦漏进产物，CDN 直接 import 时会抛 ReferenceError 且播放器无法挂载。
          ! grep -R 'process\.env' dist-lib/*.js
          echo "产物校验通过。"
          du -sh dist-lib

      - name: Push SDK to cdn branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="v${APP_VERSION}"; fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先把产物挪到工作区之外，checkout --orphan 会保留工作区文件，
          # 直接提交会把 node_modules、crates/target 等一并推上去（jsDelivr 50MB 上限）。
          rm -rf /tmp/cdn
          cp -r dist-lib /tmp/cdn

          git checkout --orphan cdn-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          # 清空工作区，只留 .git，避免任何未跟踪文件混入 CDN 分支。
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/cdn/. .

          git add -A

          git commit -m "SDK build ${TAG} (${GITHUB_SHA::7})"
          SDK_TAG="sdk-${TAG}"
          if git ls-remote --exit-code --tags origin "refs/tags/${SDK_TAG}" >/dev/null 2>&1; then
            echo "::error::不可变 SDK tag ${SDK_TAG} 已存在，请提升版本号"
            exit 1
          fi
          git tag "${SDK_TAG}"
          git push -f origin cdn-tmp:cdn
          git push origin "${SDK_TAG}"

          echo "已发布到 cdn 分支。"
          echo "jsDelivr: https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@cdn/mx-player.js"
          echo "锁定版本: https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SDK_TAG}/mx-player.js"
          echo "样式: https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SDK_TAG}/mx-player.css"
          echo "CSP Worker: https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SDK_TAG}/mx-player-worker.js（请下载后同源部署）"
