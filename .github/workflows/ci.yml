name: CI

# 只手动触发：构建与部署的时机由发布者决定，版本号也在触发时输入。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0，不带 v 前缀）'
        required: true
        default: '1.2.0'
        type: string
      deploy_pages:
        description: '同时部署到 GitHub Pages'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  APP_VERSION: ${{ github.event.inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:lib

  pages:
    if: github.event.inputs.deploy_pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build embeddable SDK
        run: pnpm build:lib
      - name: Publish SDK under the site
        run: cp -r dist-lib dist/sdk
      - name: Check GitHub Pages
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GitHub Pages
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
      - name: Explain Pages setup
        if: steps.pages-check.outputs.enabled != 'true'
        run: |
          echo "::warning::GitHub Pages is not enabled for this repository; build artifact was uploaded only."
          echo "Enable Settings > Pages > Build and deployment > GitHub Actions, then rerun this workflow."
