<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MX Player Pro</title>
<link rel="stylesheet" href="{{SDK_CDN}}/mx-player.css">
<style>
  :root { color-scheme:dark; --bg:#0b0b0b; --text:#f5f5f5; --muted:#989898; --line:rgba(255,255,255,.16); --field:#141414; }
  :root[data-theme="light"] { color-scheme:light; --bg:#fff; --text:#0b0b0b; --muted:#626262; --line:rgba(0,0,0,.16); --field:#f2f2f2; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; gap:10px; padding:10px; background:var(--bg); color:var(--text); font:13px/1.5 Inter,system-ui,sans-serif; }
  button,input { font:inherit; }
  #stage { flex:1; min-height:0; aspect-ratio:16/9; background:#000; }
  .source { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:6px 6px 6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--field); }
  .source input[type=url] { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font-size:12px; }
  .source input::placeholder { color:var(--muted); }
  .source button { height:32px; padding:0 14px; border:0; border-radius:5px; background:var(--text); color:var(--bg); font-size:12px; font-weight:800; cursor:pointer; }
  .pick { height:32px; display:inline-flex; align-items:center; padding:0 10px; border:1px solid var(--line); border-radius:5px; color:var(--muted); font-size:12px; cursor:pointer; }
  .pick input { display:none; }
  @media (max-width:640px) { body { padding:0; gap:0; } #stage { flex:0 0 auto; width:100%; height:auto; } .source { margin:8px; flex-wrap:wrap; } .source input[type=url] { flex-basis:calc(100% - 76px); } }
</style>
</head>
<body>

<div id="stage" aria-label="MX Player 播放器"></div>

<form class="source" id="source">
  <input type="url" id="url" placeholder="https://media.example.com/video.mkv" aria-label="MKV 下载地址">
  <button type="submit">播放</button>
  <label class="pick">本地文件<input type="file" id="file" accept=".mkv,video/x-matroska"></label>
</form>

<script type="module">
  import { MXPlayer } from '{{SDK_CDN}}/mx-player.js'

  const $ = (id) => document.getElementById(id)
  const player = new MXPlayer({
    playerElm: '#stage',
    localPlayback: true,
    volume: 0.85,
  })

  player.on('ready', ({ duration, tracks }) => {
    console.log('就绪 · 时长 ' + clock(duration) + ' · ' + tracks.length + ' 条轨道')
    for (const track of tracks) console.log(describe(track))
  })
  player.on('play', () => console.log('开始播放'))
  player.on('pause', () => console.log('已暂停'))
  player.on('ended', () => console.log('播放结束'))
  player.on('error', ({ message }) => console.error(message))

  $('source').addEventListener('submit', (event) => {
    event.preventDefault()
    const url = $('url').value.trim()
    if (!/^https?:\/\//i.test(url)) {
      console.error('地址必须以 http:// 或 https:// 开头。')
      return
    }
    console.log('加载 ' + url)
    player.load({ kind: 'url', url }).catch((error) => console.error(error.message))
  })

  $('file').addEventListener('change', (event) => {
    const file = event.target.files[0]
    if (!file) return
    console.log('加载本地文件 ' + file.name)
    player.load({ kind: 'file', file }).catch((error) => console.error(error.message))
  })

  function describe(track) {
    const size = track.width ? ' ' + track.width + '×' + track.height : ''
    const channels = track.channels ? ' ' + track.channels + 'ch' : ''
    const language = track.language && track.language !== 'und' ? ' [' + track.language + ']' : ''
    return '  ' + track.kind + ' #' + track.id + ' · ' + track.codecId + size + channels + language
  }

  function clock(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '00:00'
    const total = Math.floor(seconds)
    const pad = (value) => String(value).padStart(2, '0')
    const hours = Math.floor(total / 3600)
    const rest = pad(Math.floor(total % 3600 / 60)) + ':' + pad(total % 60)
    return hours ? hours + ':' + rest : rest
  }

  console.log('播放器已就位，等待媒体地址。')
</script>

</body>
</html>
